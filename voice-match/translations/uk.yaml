configuration:
  upstream_uri:
    name: "Адреса Wyoming STT"
    description: >-
      Куди надсилати очищене аудіо після перевірки голосу.
      Формат: tcp://хост:порт
      Приклад: tcp://homeassistant:10300
      У веб-інтерфейсі є кнопка «Сканувати Wyoming STT».
  verify_threshold:
    name: "Поріг верифікації голосу"
    description: >-
      Наскільки схожим має бути голос (0–1). Вище = суворіше.
      За замовчуванням 0.35. 0.28–0.32 — м’якше, 0.45–0.55 — суворіше.
      Не впливає на якість тексту — лише на те, чий голос приймається.
  extraction_threshold:
    name: "Поріг виділення сегментів"
    description: >-
      Відсікає ТБ та чужі голоси з аудіо перед STT. За замовчуванням 0.30.
      Якщо обрізає ваші слова — знизьте до 0.25–0.28.
  max_verify_seconds:
    name: "Макс. тривалість першої перевірки"
    description: "Скільки секунд аудіо брати для першої перевірки голосу (сек). За замовчуванням 5."
  verify_window_seconds:
    name: "Розмір ковзного вікна"
    description: "Розмір вікна для повторної перевірки (сек). За замовчуванням 3."
  verify_step_seconds:
    name: "Крок ковзного вікна"
    description: "Крок зміщення вікна при повторній перевірці (сек). За замовчуванням 1.5."
  stt_languages:
    name: "Мови розпізнавання"
    description: >-
      Мови через кому. Рекомендовано: uk,ru
      Українська має бути першою, якщо потрібна мова за замовчуванням.
  tag_speaker:
    name: "Додавати ім’я мовця до тексту"
    description: "Перед транскриптом додається [ім’я]. Зручно для автоматизацій і LLM."
  require_speaker_match:
    name: "Вимагати збіг голосу"
    description: "Увімкнено — чужий голос не проходить. Вимкнено — усе йде на STT (діагностика)."
  save_rejected:
    name: "Зберігати відхилені записи"
    description: "Зберігає аудіо, яке не пройшло перевірку. Для діагностики порогів."
  log_level:
    name: "Рівень логування"
    description: "DEBUG — детально, INFO — звичайно, WARNING/ERROR — лише проблеми."
  silence_threshold_enabled:
    name: "Увімкнути поріг тиші"
    description: "Якщо вимкнено — тиша не відсікається за RMS. Корисно для діагностики."
  silence_threshold:
    name: "Поріг тиші (RMS)"
    description: >-
      Рівень звуку, нижче якого вважаємо тишею (50–400).
      За замовчуванням 180. Підберіть через «Калібрування тиші» у веб-інтерфейсі:
      виміряйте фон 3 с і поставте значення трохи вище за «Макс».
  silence_timeout_enabled:
    name: "Увімкнути таймаут тиші"
    description: "Якщо вимкнено — довга тиша не призводить до швидкого порожнього Transcript."
  silence_timeout:
    name: "Час до відсікання тиші (сек)"
    description: >-
      Скільки секунд майже повної тиші потрібно, щоб одразу повернути порожній Transcript
      (1–5 с, за замовчуванням 2.0). Допомагає Voice Satellite швидко закрити сесію.
  min_speech_duration_enabled:
    name: "Увімкнути мін. довжину мови"
    description: "Якщо вимкнено — дуже короткі буфери все одно йдуть у verify."
  min_speech_duration:
    name: "Мін. довжина мови (сек)"
    description: >-
      Буфери коротші за це значення не йдуть у перевірку голосу (0.5–3 с, за замовчуванням 1.0).
      Захищає від кашлю / коротких шумів.
  early_endpoint_enabled:
    name: "Раннє завершення при тиші"
    description: >-
      Якщо з початку сесії лише тиша — через ~silence_timeout секунд надіслати порожній Transcript і закрити з'єднання з HA. HA одразу обриває STT (не чекає AudioStop / AI / TTS). Для реальної мови не спрацьовує.
