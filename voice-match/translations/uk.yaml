configuration:
  upstream_uri:
    name: "Адреса вищого ASR (upstream_uri)"
    description: >-
      Адреса вашого справжнього Wyoming STT-сервісу, куди пересилається
      очищене аудіо після перевірки голосу. Формат: tcp://IP:порт
      (наприклад, tcp://homeassistant:10300 або tcp://192.168.1.39:10300).
  verify_threshold:
    name: "Поріг верифікації голосу (verify_threshold)"
    description: >-
      Поріг косинусної схожості для підтвердження, що говорить саме
      зареєстрований користувач. Діапазон 0-1. Що вище значення, то
      суворіша перевірка: менше хибних спрацювань чужого голосу, але вищий
      ризик відхилити тиху або віддалену мову. Рекомендовано 0.30 (м'яко) —
      0.55 (суворо). За замовчуванням 0.40.
  extraction_threshold:
    name: "Поріг виділення сегментів (extraction_threshold)"
    description: >-
      Поріг схожості для виділення саме ваших фрагментів мови з фонового
      шуму або голосів інших людей поруч (наприклад, ТБ чи розмова в тій
      самій кімнаті). Діапазон 0-1. За замовчуванням 0.35.
  max_verify_seconds:
    name: "Макс. тривалість першої перевірки (max_verify_seconds)"
    description: >-
      Максимальна тривалість аудіо, що використовується для першого проходу
      верифікації голосу. Якщо аудіо коротше — перевіряється повністю.
      За замовчуванням 5 секунд.
  verify_window_seconds:
    name: "Розмір ковзного вікна (verify_window_seconds)"
    description: >-
      Розмір вікна для резервної (повторної) верифікації, якщо перший
      прохід не дав впевненого результату. За замовчуванням 3 секунди.
  verify_step_seconds:
    name: "Крок ковзного вікна (verify_step_seconds)"
    description: >-
      Крок зміщення ковзного вікна при резервній верифікації.
      За замовчуванням 1.5 секунди.
  stt_languages:
    name: "Мови розпізнавання (stt_languages)"
    description: >-
      Список мов через кому (наприклад, uk,en,ru), які гарантовано будуть
      оголошені Home Assistant — навіть якщо вищий ASR-сервіс не вказав їх
      сам. Потрібно, щоб цей аддон можна було вибрати як STT для пайплайну
      потрібною мовою. За замовчуванням: uk.
  tag_speaker:
    name: "Додавати ім'я мовця (tag_speaker)"
    description: >-
      Якщо увімкнено — перед розпізнаним текстом додається префікс
      [ім'я_мовця]. Корисно, якщо транскрипт обробляється LLM-агентом і
      потрібно знати, хто саме промовив команду.
  require_speaker_match:
    name: "Вимагати збіг голосу (require_speaker_match)"
    description: >-
      Якщо увімкнено — аудіо пересилається на розпізнавання мови лише після
      успішної верифікації голосу. Якщо вимкнено — сервіс працює в
      "прозорому" режимі і пересилає все аудіо без перевірки (корисно для
      діагностики).
  save_rejected:
    name: "Зберігати відхилені записи (save_rejected)"
    description: >-
      Зберігає аудіокліпи та метадані для команд, які не пройшли
      верифікацію голосу. Корисно для діагностики та подальшого
      донастроювання порогів, але займає місце на диску — рекомендовано
      вмикати тимчасово.
  log_level:
    name: "Рівень логування (log_level)"
    description: >-
      Детальність логів сервісу. DEBUG — максимально детально (корисно при
      діагностиці проблем), INFO — стандартний рівень, WARNING/ERROR —
      лише попередження та помилки.
