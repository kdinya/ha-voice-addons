configuration:
  upstream_uri:
    name: "Адреса Wyoming STT"
    description: >-
      Куди надсилати очищене аудіо після перевірки голосу.
      Формат: tcp://хост:порт
      Приклади: tcp://homeassistant:10300 (OpenAI STT або Faster Whisper).
      У веб-інтерфейсі Voice Match є кнопка «Сканувати Wyoming STT».
  verify_threshold:
    name: "Поріг верифікації голосу"
    description: >-
      Наскільки схожим має бути голос (0–1). Вище = суворіше.
      0.30 — м’яко, 0.40 — за замовчуванням, 0.50–0.55 — суворо.
      Не впливає на якість розпізнавання тексту — лише на те, чий голос приймається.
  extraction_threshold:
    name: "Поріг виділення голосу з фону"
    description: >-
      Відсікає ТБ та чужі голоси. За замовчуванням 0.35.
      Нижче — більше аудіо проходить далі; вище — жорсткіше чистить фон.
  max_verify_seconds:
    name: "Макс. тривалість першої перевірки (сек)"
    description: >-
      Скільки секунд аудіо брати для першої перевірки голосу. За замовчуванням 5.
  verify_window_seconds:
    name: "Розмір ковзного вікна (сек)"
    description: >-
      Розмір вікна для повторної перевірки, якщо перша невпевнена. За замовчуванням 3.
  verify_step_seconds:
    name: "Крок ковзного вікна (сек)"
    description: >-
      Крок зміщення вікна при повторній перевірці. За замовчуванням 1.5.
  stt_languages:
    name: "Мови розпізнавання"
    description: >-
      Мови через кому (наприклад uk,en). Аддон оголосить їх Home Assistant,
      щоб pipeline міг вибрати українську навіть якщо upstream не вказав її.
  tag_speaker:
    name: "Додавати ім’я мовця до тексту"
    description: >-
      Перед транскриптом з’явиться [ім’я]. Корисно для LLM-агентів.
  require_speaker_match:
    name: "Вимагати збіг голосу"
    description: >-
      Увімкнено — чужий голос не проходить. Вимкнено — усе йде на STT (діагностика).
  save_rejected:
    name: "Зберігати відхилені записи"
    description: >-
      Зберігає аудіо, яке не пройшло перевірку. Зручно для налаштування порогів.
  log_level:
    name: "Рівень логування"
    description: >-
      DEBUG — максимально детально, INFO — звичайний режим, WARNING/ERROR — лише проблеми.
