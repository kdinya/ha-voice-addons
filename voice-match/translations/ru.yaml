configuration:
  upstream_uri:
    name: "Адрес Wyoming STT"
    description: >-
      Куда отправлять очищенное аудио после проверки голоса.
      Формат: tcp://хост:порт
      Пример: tcp://homeassistant:10300
      В веб-интерфейсе есть кнопка «Сканировать Wyoming STT».
  verify_threshold:
    name: "Порог верификации голоса"
    description: >-
      Насколько похожим должен быть голос (0–1). Выше = строже.
      По умолчанию 0.35. 0.28–0.32 — мягче, 0.45–0.55 — строже.
      Не влияет на качество текста — только на то, чей голос принимается.
  extraction_threshold:
    name: "Порог выделения сегментов"
    description: >-
      Отсекает ТВ и чужие голоса из аудио перед STT. По умолчанию 0.30.
      Если обрезает ваши слова — снизьте до 0.25–0.28.
  max_verify_seconds:
    name: "Макс. длительность первой проверки"
    description: "Сколько секунд аудио брать для первой проверки голоса (сек). По умолчанию 5."
  verify_window_seconds:
    name: "Размер скользящего окна"
    description: "Размер окна для повторной проверки (сек). По умолчанию 3."
  verify_step_seconds:
    name: "Шаг скользящего окна"
    description: "Шаг смещения окна при повторной проверке (сек). По умолчанию 1.5."
  stt_languages:
    name: "Языки распознавания"
    description: >-
      Языки через запятую. Рекомендуется: uk,ru
      Украинский первым — если нужна язык по умолчанию.
  tag_speaker:
    name: "Добавлять имя говорящего к тексту"
    description: "Перед транскриптом добавляется [имя]. Удобно для автоматизаций и LLM."
  require_speaker_match:
    name: "Требовать совпадение голоса"
    description: "Включено — чужой голос не проходит. Выключено — всё идёт на STT (диагностика)."
  save_rejected:
    name: "Сохранять отклонённые записи"
    description: "Сохраняет аудио, не прошедшее проверку. Для настройки порогов."
  log_level:
    name: "Уровень логирования"
    description: "DEBUG — подробно, INFO — обычно, WARNING/ERROR — только проблемы."
  silence_threshold_enabled:
    name: "Включить порог тишины"
    description: "Если выключено — тишина не отсекается по RMS. Полезно для диагностики."
  silence_threshold:
    name: "Порог тишины (RMS)"
    description: >-
      Уровень звука, ниже которого считаем тишиной (50–400).
      По умолчанию 180. Подберите через «Калибровку тишины» в веб-интерфейсе:
      измерьте фон 3 с и поставьте значение чуть выше «Макс».
  silence_timeout_enabled:
    name: "Включить таймаут тишины"
    description: "Если выключено — длинная тишина не приводит к быстрому пустому Transcript."
  silence_timeout:
    name: "Время до отсечения тишины (сек)"
    description: >-
      Сколько секунд почти полной тишины нужно, чтобы сразу вернуть пустой Transcript
      (1–5 с, по умолчанию 2.0). Помогает Voice Satellite быстро закрыть сессию.
  min_speech_duration_enabled:
    name: "Включить мин. длину речи"
    description: "Если выключено — очень короткие буферы всё равно идут в verify."
  min_speech_duration:
    name: "Мин. длина речи (сек)"
    description: >-
      Буферы короче этого значения не идут в проверку голоса (0.5–3 с, по умолчанию 1.0).
      Защищает от кашля / коротких шумов.
  early_endpoint_enabled:
    name: "Раннее завершение при тишине"
    description: >-
      Если с начала сессии только тишина — через ~silence_timeout секунд отправить пустой Transcript и закрыть соединение с HA. HA сразу обрывает STT (не ждёт AudioStop / AI / TTS). Для реальной речи не срабатывает.
