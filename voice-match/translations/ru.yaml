configuration:
  upstream_uri:
    name: "Адрес вышестоящего ASR (upstream_uri)"
    description: >-
      Адрес вашего настоящего Wyoming STT-сервиса, куда пересылается очищенное
      аудио после проверки голоса. Формат: tcp://IP:порт
      (например, tcp://homeassistant:10300 или tcp://192.168.1.39:10300).
  verify_threshold:
    name: "Порог верификации голоса (verify_threshold)"
    description: >-
      Порог косинусного сходства для подтверждения, что говорит именно
      зарегистрированный пользователь. Диапазон 0-1. Чем выше значение, тем
      строже проверка: меньше ложных срабатываний чужого голоса, но выше риск
      отклонить тихую или удалённую речь. Рекомендуется 0.30 (мягко) —
      0.55 (строго). По умолчанию 0.40.
  extraction_threshold:
    name: "Порог выделения сегментов (extraction_threshold)"
    description: >-
      Порог сходства для выделения именно ваших фрагментов речи из фонового
      шума или голосов других людей рядом (например, ТВ или разговор в той
      же комнате). Диапазон 0-1. По умолчанию 0.35.
  max_verify_seconds:
    name: "Макс. длительность первой проверки (max_verify_seconds)"
    description: >-
      Максимальная длительность аудио, используемая для первого прохода
      верификации голоса. Если аудио короче — проверяется целиком.
      По умолчанию 5 секунд.
  verify_window_seconds:
    name: "Размер скользящего окна (verify_window_seconds)"
    description: >-
      Размер окна для резервной (повторной) верификации, если первый проход
      не дал уверенного результата. По умолчанию 3 секунды.
  verify_step_seconds:
    name: "Шаг скользящего окна (verify_step_seconds)"
    description: >-
      Шаг смещения скользящего окна при резервной верификации.
      По умолчанию 1.5 секунды.
  stt_languages:
    name: "Языки распознавания (stt_languages)"
    description: >-
      Список языков через запятую (например, uk,en,ru), которые будут
      гарантированно объявлены Home Assistant — даже если вышестоящий ASR-
      сервис не указал их сам. Нужно для того, чтобы этот аддон можно было
      выбрать в качестве STT для пайплайна на нужном языке. По умолчанию: uk.
  tag_speaker:
    name: "Добавлять имя говорящего (tag_speaker)"
    description: >-
      Если включено — перед распознанным текстом добавляется префикс
      [имя_говорящего]. Полезно, если транскрипт обрабатывается LLM-агентом
      и нужно знать, кто именно произнёс команду.
  require_speaker_match:
    name: "Требовать совпадение голоса (require_speaker_match)"
    description: >-
      Если включено — аудио пересылается на распознавание речи только после
      успешной верификации голоса. Если выключено — сервис работает в
      "прозрачном" режиме и пересылает всё аудио без проверки (полезно для
      диагностики).
  save_rejected:
    name: "Сохранять отклонённые записи (save_rejected)"
    description: >-
      Сохраняет аудиоклипы и метаданные для команд, которые не прошли
      верификацию голоса. Полезно для диагностики и последующей донастройки
      порогов, но занимает место на диске — рекомендуется включать временно.
  log_level:
    name: "Уровень логирования (log_level)"
    description: >-
      Подробность логов сервиса. DEBUG — максимально подробно (полезно при
      диагностике проблем), INFO — стандартный уровень, WARNING/ERROR — только
      предупреждения и ошибки.
