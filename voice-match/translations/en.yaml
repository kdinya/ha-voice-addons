configuration:
  upstream_uri:
    name: "Wyoming STT address"
    description: >-
      Where cleaned audio is sent after voice verification.
      Format: tcp://host:port (e.g. tcp://homeassistant:10300).
      Use the “Scan Wyoming STT” button in the Voice Match web UI.
  verify_threshold:
    name: "Voice verification threshold"
    description: >-
      Cosine similarity threshold (0–1). Higher = stricter.
      Default 0.40. Does not affect transcription quality — only who is accepted.
  extraction_threshold:
    name: "Voice extraction threshold"
    description: >-
      Strips TV/other voices. Default 0.35.
  max_verify_seconds:
    name: "Max first verification length (sec)"
    description: "Audio length used for the first verification pass. Default 5."
  verify_window_seconds:
    name: "Sliding window size (sec)"
    description: "Window size for fallback verification. Default 3."
  verify_step_seconds:
    name: "Sliding window step (sec)"
    description: "Step for sliding window. Default 1.5."
  stt_languages:
    name: "Recognition languages"
    description: >-
      Comma-separated languages advertised to Home Assistant (e.g. uk,en).
  tag_speaker:
    name: "Tag speaker name in transcript"
    description: "Prepend [name] to the transcript."
  require_speaker_match:
    name: "Require speaker match"
    description: "If off, all audio is forwarded (diagnostics)."
  save_rejected:
    name: "Save rejected samples"
    description: "Keep audio that failed verification."
  log_level:
    name: "Log level"
    description: "DEBUG / INFO / WARNING / ERROR"
