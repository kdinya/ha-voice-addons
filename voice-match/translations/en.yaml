configuration:
  upstream_uri:
    name: "Wyoming STT address"
    description: >-
      Where cleaned audio is sent after voice verification.
      Format: tcp://host:port (e.g. tcp://homeassistant:10300).
      Use “Scan Wyoming STT” in the web UI.
  verify_threshold:
    name: "Voice verification threshold"
    description: >-
      Similarity threshold (0–1). Higher = stricter. Default 0.35.
      Does not affect transcription quality — only who is accepted.
  extraction_threshold:
    name: "Segment extraction threshold"
    description: >-
      Strips TV/other voices before STT. Default 0.30.
      If your words are cut off, lower to 0.25–0.28.
  max_verify_seconds:
    name: "Max first verification length"
    description: "Seconds of audio for the first verification pass. Default 5."
  verify_window_seconds:
    name: "Sliding window size"
    description: "Window size for fallback verification (sec). Default 3."
  verify_step_seconds:
    name: "Sliding window step"
    description: "Step for sliding window (sec). Default 1.5."
  stt_languages:
    name: "Recognition languages"
    description: "Comma-separated languages, e.g. uk,ru. Put Ukrainian first as default."
  tag_speaker:
    name: "Tag speaker name in transcript"
    description: "Prepend [name] to the transcript."
  require_speaker_match:
    name: "Require speaker match"
    description: "If off, all audio is forwarded (diagnostics)."
  save_rejected:
    name: "Save rejected samples"
    description: "Keep audio that failed verification."
  log_level:
    name: "Log level"
    description: "DEBUG / INFO / WARNING / ERROR"
  silence_threshold_enabled:
    name: "Enable silence threshold"
    description: "If off, silence is not rejected by RMS level. Useful for diagnostics."
  silence_threshold:
    name: "Silence threshold (RMS)"
    description: >-
      Sound level below which audio is treated as silence (50–400).
      Default 180. Use “Silence calibration” in the web UI: measure background for 3 s
      and set a value slightly above the measured Max.
  silence_timeout_enabled:
    name: "Enable silence timeout"
    description: "If off, long silence will not trigger a fast empty Transcript."
  silence_timeout:
    name: "Silence timeout (sec)"
    description: >-
      Seconds of near-total silence before returning an empty Transcript immediately
      (1–5 s, default 2.0). Helps Voice Satellite close the session quickly.
  min_speech_duration_enabled:
    name: "Enable minimum speech duration"
    description: "If off, very short buffers still go to verification."
  min_speech_duration:
    name: "Minimum speech duration (sec)"
    description: >-
      Buffers shorter than this are not sent to voice verification (0.5–3 s, default 1.0).
      Protects against coughs / short noises.
