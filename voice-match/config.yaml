name: "Voice Match"
version: "2.0.12"
slug: "voice_match"
description: "Верифікація голосу для Home Assistant. Повністю автономний. Hot-reload voiceprints — рестарт після enrollment більше не потрібен."
url: "https://github.com/kdinya/ha-voice-addons"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  10350/tcp: 10350
ports_description:
  10350/tcp: "Порт Wyoming — додайте інтеграцію Wyoming Protocol"
ingress: true
ingress_port: 8099
panel_icon: mdi:account-voice
panel_title: "Voice Match"
panel_admin: true
map:
  - data:rw
hassio_api: true
options:
  upstream_uri: "tcp://homeassistant:10300"
  verify_threshold: 0.35
  extraction_threshold: 0.30
  max_verify_seconds: 5.0
  verify_window_seconds: 3.0
  verify_step_seconds: 1.5
  stt_languages: "uk,ru"
  tag_speaker: false
  require_speaker_match: true
  save_rejected: false
  log_level: "INFO"
  silence_threshold_enabled: true
  silence_threshold: 180
  silence_timeout_enabled: true
  silence_timeout: 2.0
  min_speech_duration_enabled: true
  min_speech_duration: 1.0
schema:
  upstream_uri: "str"
  verify_threshold: "float(0,1)"
  extraction_threshold: "float(0,1)"
  max_verify_seconds: "float(1,30)"
  verify_window_seconds: "float(1,10)"
  verify_step_seconds: "float(0.5,5)"
  stt_languages: "str"
  tag_speaker: "bool"
  require_speaker_match: "bool"
  save_rejected: "bool"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  silence_threshold_enabled: "bool"
  silence_threshold: "int(50,400)"
  silence_timeout_enabled: "bool"
  silence_timeout: "float(1,5)"
  min_speech_duration_enabled: "bool"
  min_speech_duration: "float(0.5,3)"
