name: "Voice Match"
version: "1.2.0"
slug: "voice_match"
description: "Speaker-verified ASR proxy. Verifies your voice, strips TV/background noise, then forwards cleaned audio to any Wyoming STT. Includes Ingress web UI for easy voice enrollment."
url: "https://github.com/YOUR_USERNAME/ha-voice-addons"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  10350/tcp: 10350
ports_description:
  10350/tcp: "Wyoming protocol port — add this as a Wyoming Protocol integration in Home Assistant"
ingress: true
ingress_port: 8099
panel_icon: mdi:account-voice
panel_title: "Voice Match"
panel_admin: true
map:
  - data:rw
options:
  upstream_uri: "tcp://homeassistant:10300"
  verify_threshold: 0.40
  extraction_threshold: 0.35
  max_verify_seconds: 5.0
  verify_window_seconds: 3.0
  verify_step_seconds: 1.5
  stt_languages: "uk"
  tag_speaker: false
  require_speaker_match: true
  save_rejected: false
  log_level: "INFO"
schema:
  upstream_uri: "str"
  verify_threshold: "float(0,1)"
  extraction_threshold: "float(0,1)"
  max_verify_seconds: "float(1,30)"
  verify_window_seconds: "float(1,10)"
  verify_step_seconds: "float(0.5,5)"
  stt_languages: "str"
  tag_speaker: "bool"
  require_speaker_match: "bool"
  save_rejected: "bool"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
