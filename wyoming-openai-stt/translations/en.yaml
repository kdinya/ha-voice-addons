configuration:
  base_url:
    name: "API base URL"
    description: >-
      OpenAI-compatible API base URL.
      Groq: https://api.groq.com/openai/v1
      OpenAI: https://api.openai.com/v1
  api_key:
    name: "API key"
    description: "Provider API key (Groq keys start with gsk_)."
  model:
    name: "Model"
    description: >-
      Groq: whisper-large-v3-turbo (fast) or whisper-large-v3 (more accurate).
      OpenAI: whisper-1, gpt-4o-mini-transcribe, gpt-4o-transcribe.
  languages:
    name: "Languages"
    description: >-
      Space-separated languages. Recommended: uk ru
      Ukrainian first = default when detection is unsure.
  language_mode:
    name: "Language mode"
    description: >-
      auto — model picks between Ukrainian and Russian (recommended).
      fixed — always use the first language in the list (uk).
  log_level:
    name: "Log level"
    description: "DEBUG / INFO / WARNING / ERROR"
