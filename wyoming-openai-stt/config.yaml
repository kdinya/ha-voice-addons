name: "Wyoming OpenAI STT"
version: "1.0.0"
slug: "wyoming_openai_stt"
description: "Wyoming Speech-to-Text using any OpenAI-compatible API (OpenAI, Groq, LocalAI, Speaches, etc.). Simple configuration: base URL, API key, model."
url: "https://github.com/YOUR_USERNAME/ha-voice-addons"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  10300/tcp: 10300
ports_description:
  10300/tcp: "Wyoming protocol port — add as Wyoming Protocol integration or use as upstream for Voice Match"
map:
  - data:rw
options:
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: "whisper-1"
  languages: "uk en"
  log_level: "INFO"
schema:
  base_url: "str"
  api_key: "password"
  model: "str"
  languages: "str"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
