name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check (Voice Match)
        run: |
          python -m py_compile voice-match/entrypoint.py
          python -m py_compile voice-match/webui.py
          python -m py_compile voice-match/scripts/enroll.py
          python -m py_compile voice-match/wyoming_voice_match/__init__.py
          python -m py_compile voice-match/wyoming_voice_match/__main__.py
          python -m py_compile voice-match/wyoming_voice_match/handler.py
          python -m py_compile voice-match/wyoming_voice_match/verify.py

      - name: Validate config.yaml versions present
        run: |
          python - <<'PY'
          import re, pathlib, sys
          for path in ["voice-match/config.yaml", "wyoming-openai-stt/config.yaml"]:
              text = pathlib.Path(path).read_text(encoding="utf-8")
              m = re.search(r'^version:\s*["\']?([^"\'\s]+)', text, re.M)
              if not m:
                  print(f"FAIL: no version in {path}")
                  sys.exit(1)
              print(f"OK {path}: {m.group(1)}")
          PY

      - name: YAML-ish structure check
        run: |
          python - <<'PY'
          import pathlib, sys
          for path in ["voice-match/config.yaml", "wyoming-openai-stt/config.yaml", "repository.yaml"]:
              text = pathlib.Path(path).read_text(encoding="utf-8")
              if "name:" not in text:
                  print(f"FAIL: {path} missing name")
                  sys.exit(1)
              print(f"OK structure {path}")
          PY

      - name: Smoke — analyze_wav helpers importable
        run: |
          python - <<'PY'
          # Minimal structural check without torch/speechbrain
          import ast, pathlib
          src = pathlib.Path("voice-match/webui.py").read_text(encoding="utf-8")
          tree = ast.parse(src)
          routes = []
          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef):
                  for dec in node.decorator_list:
                      if isinstance(dec, ast.Call) and getattr(dec.func, "attr", "") == "route":
                          if dec.args and isinstance(dec.args[0], ast.Constant):
                              routes.append(dec.args[0].value)
          need = ["/api/analyze_blob", "/enroll", "/api/status", "/api/check_quality"]
          missing = [r for r in need if r not in routes]
          if missing:
              raise SystemExit(f"Missing routes: {missing}")
          print("OK routes:", ", ".join(need))
          PY
