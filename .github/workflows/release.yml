name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Notes from CHANGELOG
        id: notes
        run: |
          {
            echo "## Voice Match"
            if [ -f voice-match/CHANGELOG.md ]; then
              awk -v v="${{ steps.ver.outputs.VERSION }}" '
                $0 ~ "^##[[:space:]]*"v {p=1; print; next}
                p && /^## / {exit}
                p {print}
              ' voice-match/CHANGELOG.md
            fi
            echo ""
            echo "## Wyoming OpenAI STT"
            if [ -f wyoming-openai-stt/CHANGELOG.md ]; then
              awk -v v="${{ steps.ver.outputs.VERSION }}" '
                $0 ~ "^##[[:space:]]*"v {p=1; print; next}
                p && /^## / {exit}
                p {print}
              ' wyoming-openai-stt/CHANGELOG.md
            fi
          } > /tmp/notes.md
          echo "path=/tmp/notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.ver.outputs.VERSION }}"
          body_path: /tmp/notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
